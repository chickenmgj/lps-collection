{% extends "base.html" %}

{% block title %}
    Create Admin Account | LPSChileCollection
{% endblock %}

{% block content %}

<h2 class="page-title">Create Admin Account</h2>

<div class="form-container">


    <form action="{{ url_for('admin_register') }}" method="POST">

        <label for="first_name">
            Name
        </label>

        <input
            type="text"
            id="first_name"
            name="first_name"
            required
        >

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
        >

        <label for="confirm_password">
            Confirm password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="8"
            required
        >

        <button type="submit" class="submit-btn">
            Create administrator
        </button>

    </form>

</div>

{% endblock %}
